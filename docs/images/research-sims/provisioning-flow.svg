<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#374151"/></marker>
  </defs>
  <rect width="960" height="560" rx="16" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Как SIM попадают в базы</text>

  <!-- zones -->
  <rect x="20" y="60" width="300" height="470" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-dasharray="6 4"/>
  <text x="170" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">Только у оператора, вне Git</text>
  <rect x="340" y="60" width="280" height="470" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="6 4"/>
  <text x="480" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">scripts/research_sims.py</text>
  <rect x="640" y="60" width="300" height="470" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-dasharray="6 4"/>
  <text x="790" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#047857">Базы стенда</text>

  <!-- left -->
  <rect x="45" y="105" width="250" height="90" rx="10" fill="#ffffff" stroke="#ef4444"/>
  <text x="170" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">sim_imsi.xlsx</text>
  <text x="170" y="156" text-anchor="middle" font-size="12" fill="#4b5563">IMSI, ICCID, ACC, PIN/PUK,</text>
  <text x="170" y="174" text-anchor="middle" font-size="12" fill="#4b5563">Ki, OPc — 10 карт</text>

  <rect x="45" y="300" width="250" height="90" rx="10" fill="#ffffff" stroke="#ef4444"/>
  <text x="170" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">local/secrets/</text>
  <text x="170" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">research-sims.csv</text>
  <text x="170" y="370" text-anchor="middle" font-size="12" fill="#4b5563">IMSI, ICCID, Ki, OPc, AMF, MSISDN</text>

  <text x="170" y="440" text-anchor="middle" font-size="12" fill="#b91c1c">PIN/PUK остаются в xlsx</text>
  <text x="170" y="460" text-anchor="middle" font-size="12" fill="#b91c1c">Ki/OPc не выводятся в консоль</text>
  <text x="170" y="480" text-anchor="middle" font-size="12" fill="#b91c1c">и блокируются в исходниках</text>

  <!-- middle -->
  <g font-size="14">
    <rect x="370" y="110" width="220" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="480" y="134" text-anchor="middle" font-weight="700" fill="#1e3a8a">import</text>
    <text x="480" y="154" text-anchor="middle" font-size="12" fill="#1e40af">отбрасывает PIN/PUK</text>

    <rect x="370" y="200" width="220" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="480" y="224" text-anchor="middle" font-weight="700" fill="#1e3a8a">plan</text>
    <text x="480" y="244" text-anchor="middle" font-size="12" fill="#1e40af">PLMN, Luhn ICCID, ключи, номера</text>

    <rect x="370" y="290" width="220" height="56" rx="10" fill="#2563eb"/>
    <text x="480" y="314" text-anchor="middle" font-weight="700" fill="#ffffff">apply</text>
    <text x="480" y="334" text-anchor="middle" font-size="12" fill="#dbeafe">также из start_lab / start_partner</text>

    <rect x="370" y="380" width="220" height="56" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="480" y="404" text-anchor="middle" font-weight="700" fill="#1e3a8a">status · phone_readiness</text>
    <text x="480" y="424" text-anchor="middle" font-size="12" fill="#1e40af">только чтение</text>

    <rect x="370" y="460" width="220" height="50" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="480" y="482" text-anchor="middle" font-weight="700" fill="#1e3a8a">oai-sql · retire</text>
    <text x="480" y="500" text-anchor="middle" font-size="12" fill="#1e40af">UDR партнёров · старый PLMN</text>
  </g>

  <!-- right -->
  <rect x="665" y="150" width="250" height="110" rx="10" fill="#ffffff" stroke="#10b981"/>
  <text x="790" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">OAI UDR (MySQL)</text>
  <text x="790" y="202" text-anchor="middle" font-size="12" fill="#374151">5G AKA, Milenage: Ki + OPc</text>
  <text x="790" y="222" text-anchor="middle" font-size="12" fill="#374151">DNN internet + ims</text>
  <text x="790" y="242" text-anchor="middle" font-size="12" fill="#374151">без --ims-only</text>

  <rect x="665" y="320" width="250" height="110" rx="10" fill="#ffffff" stroke="#10b981"/>
  <text x="790" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">PyHSS</text>
  <text x="790" y="372" text-anchor="middle" font-size="12" fill="#374151">AuC (тот же Ki + OPc, ICCID)</text>
  <text x="790" y="392" text-anchor="middle" font-size="12" fill="#374151">subscriber + IMS subscriber</text>
  <text x="790" y="412" text-anchor="middle" font-size="12" fill="#374151">MSISDN 2600–2609, iFC</text>

  <text x="790" y="470" text-anchor="middle" font-size="12" fill="#047857">Существующие записи не перезаписываются:</text>
  <text x="790" y="490" text-anchor="middle" font-size="12" fill="#047857">SQN сохраняется, другие ключи — ошибка</text>

  <!-- arrows -->
  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M295 150 H366"/>
    <path d="M370 158 H335 V318 H299"/>
    <path d="M295 362 H355 V240 H366"/>
    <path d="M480 256 V286"/>
    <path d="M590 310 C625 310 625 205 661 205"/>
    <path d="M590 326 C625 326 625 375 661 375"/>
  </g>
</svg>
