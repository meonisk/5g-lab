<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#374151"/></marker>
  </defs>
  <rect width="960" height="430" rx="16" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Один Ki/OPc карты — две аутентификации</text>

  <!-- phone -->
  <rect x="30" y="120" width="150" height="200" rx="18" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="105" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">Телефон</text>
  <rect x="55" y="170" width="100" height="62" rx="6" fill="#fde68a" stroke="#d97706"/>
  <text x="105" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">USIM/ISIM</text>
  <text x="105" y="216" text-anchor="middle" font-size="12" fill="#78350f">IMSI 90170…</text>
  <text x="105" y="262" text-anchor="middle" font-size="12" fill="#374151">номер 26xx</text>
  <text x="105" y="282" text-anchor="middle" font-size="12" fill="#374151">штатная звонилка</text>

  <!-- gNB -->
  <rect x="225" y="85" width="140" height="70" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="295" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">gNB</text>
  <text x="295" y="136" text-anchor="middle" font-size="12" fill="#9a3412">вещает 901/70</text>

  <!-- 5GC -->
  <rect x="410" y="70" width="250" height="100" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="535" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">OAI 5GC</text>
  <text x="535" y="120" text-anchor="middle" font-size="12" fill="#374151">AMF → AUSF → UDM → UDR</text>
  <text x="535" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">① 5G AKA с Ki/OPc карты</text>
  <text x="535" y="160" text-anchor="middle" font-size="12" fill="#374151">PDU internet + ims, P-CSCF в PCO</text>

  <!-- IMS -->
  <rect x="410" y="240" width="250" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="535" y="268" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">IMS</text>
  <text x="535" y="290" text-anchor="middle" font-size="12" fill="#374151">P-CSCF (IPsec) → I/S-CSCF → PyHSS</text>
  <text x="535" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">② IMS AKA с тем же Ki/OPc</text>
  <text x="535" y="332" text-anchor="middle" font-size="12" fill="#374151">IMPI 90170…@ims.mnc070.mcc901…</text>

  <!-- destinations -->
  <rect x="710" y="200" width="220" height="70" rx="10" fill="#ffffff" stroke="#6b7280"/>
  <text x="820" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Другая SIM</text>
  <text x="820" y="250" text-anchor="middle" font-size="12" fill="#374151">2600 – 2609</text>
  <rect x="710" y="290" width="220" height="70" rx="10" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="820" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">AI-услуги</text>
  <text x="820" y="340" text-anchor="middle" font-size="12" fill="#374151">1003 – 1006 (перевод, запись)</text>

  <g stroke="#374151" stroke-width="2" fill="none" marker-end="url(#b)">
    <path d="M180 170 C200 150 205 125 221 122"/>
    <path d="M365 120 H406"/>
    <path d="M535 170 V236"/>
    <path d="M180 270 C300 300 330 300 406 296"/>
    <path d="M660 280 C685 280 690 235 706 235"/>
    <path d="M660 310 C685 310 690 325 706 325"/>
  </g>
  <text x="290" y="318" text-anchor="middle" font-size="12" fill="#374151">SIP через IMS PDU</text>

  <text x="480" y="400" text-anchor="middle" font-size="12" fill="#6b7280">UDR и PyHSS ведут свои SQN: однократный Sync Failure (AUTS) ожидаем, SQN не сбрасывать</text>
</svg>
