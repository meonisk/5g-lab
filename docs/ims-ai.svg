<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="sip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fbf"/></marker>
    <marker id="dia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fb5"/></marker>
    <marker id="rtp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b3e"/></marker>
    <marker id="http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d2691e"/></marker>
    <marker id="dns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker>
    <style>
      .net { font-size: 14px; font-weight: bold; }
      .netsub { font-size: 12px; }
      .t { font-size: 13px; font-weight: bold; fill: #111; }
      .c { font-size: 11.5px; fill: #222; font-family: DejaVu Sans Mono, Consolas, monospace; }
      .d { font-size: 11.5px; fill: #333; }
      .box { fill: #fff; stroke: #333; stroke-width: 1.3; }
      .lbl { font-size: 11.5px; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
      .num { font-size: 11px; font-weight: bold; fill: #fff; }
    </style>
  </defs>
  <rect width="1440" height="960" fill="#ffffff"/>

  <!-- Phone outside Docker -->
  <rect x="20" y="315" width="140" height="100" rx="10" fill="#fffbe6" stroke="#b59a2a"/>
  <text x="90" y="340" text-anchor="middle" class="t">Телефон (UE)</text>
  <text x="90" y="358" text-anchor="middle" class="d">через gNB партнёра</text>
  <text x="90" y="376" text-anchor="middle" class="c">PDU-сессия ims</text>
  <text x="90" y="394" text-anchor="middle" class="c">12.1.1.x</text>

  <!-- Core network oai-cn5g -->
  <path d="M 194 50 H 1406 Q 1420 50 1420 64 V 226 Q 1420 240 1406 240 H 1060 V 906 Q 1060 920 1046 920 H 194 Q 180 920 180 906 V 64 Q 180 50 194 50 Z" fill="#eef4fb" stroke="#4a78b5" stroke-width="2"/>
  <text x="200" y="895" class="net" fill="#2c5591">Docker-сеть ядра «oai-cn5g» (bridge, CORE_NETWORK_NAME)</text>
  <text x="200" y="912" class="netsub" fill="#2c5591">подсеть 192.168.70.128/26 · у каждого контейнера один интерфейс eth0 в этой сети</text>

  <!-- Partner core -->
  <rect x="195" y="95" width="175" height="320" rx="8" fill="#e4e4e4" stroke="#777"/>
  <text x="282" y="118" text-anchor="middle" class="t">Ядро OAI партнёра</text>
  <text x="282" y="140" text-anchor="middle" class="d">AMF · SMF · NRF</text>
  <text x="282" y="158" text-anchor="middle" class="d">AUSF · UDM · UDR</text>
  <text x="282" y="184" text-anchor="middle" class="d">SMF выдаёт UE:</text>
  <text x="282" y="201" text-anchor="middle" class="c">DNS 192.168.70.160</text>
  <text x="282" y="218" text-anchor="middle" class="c">P-CSCF .166</text>
  <rect x="208" y="300" width="150" height="100" rx="6" class="box"/>
  <text x="283" y="322" text-anchor="middle" class="t">UPF</text>
  <text x="283" y="340" text-anchor="middle" class="c">192.168.70.134</text>
  <text x="283" y="358" text-anchor="middle" class="d">tun0: пул UE</text>
  <text x="283" y="375" text-anchor="middle" class="c">12.1.1.0/24</text>
  <text x="283" y="392" text-anchor="middle" class="d">N6 без NAT</text>

  <!-- Signalling column -->
  <rect x="410" y="95" width="185" height="75" rx="6" class="box"/>
  <text x="502" y="117" text-anchor="middle" class="t">S-CSCF</text>
  <text x="502" y="135" text-anchor="middle" class="c">lab-scscf</text>
  <text x="502" y="153" text-anchor="middle" class="c">.165 : 6060</text>

  <rect x="410" y="215" width="185" height="75" rx="6" class="box"/>
  <text x="502" y="237" text-anchor="middle" class="t">I-CSCF</text>
  <text x="502" y="255" text-anchor="middle" class="c">lab-icscf</text>
  <text x="502" y="273" text-anchor="middle" class="c">.164 : 5060</text>

  <rect x="410" y="335" width="185" height="75" rx="6" class="box"/>
  <text x="502" y="357" text-anchor="middle" class="t">P-CSCF</text>
  <text x="502" y="375" text-anchor="middle" class="c">lab-pcscf</text>
  <text x="502" y="393" text-anchor="middle" class="c">.166 : 5060</text>

  <!-- Shared network namespace of RTPengine and Media Adapter -->
  <rect x="400" y="570" width="205" height="225" rx="8" fill="none" stroke="#2e8b3e" stroke-dasharray="6 4"/>
  <text x="502" y="810" text-anchor="middle" class="d" fill="#2e8b3e">общий netns: один IP .161</text>
  <rect x="410" y="600" width="185" height="85" rx="6" class="box"/>
  <text x="502" y="621" text-anchor="middle" class="t">RTPengine</text>
  <text x="502" y="639" text-anchor="middle" class="c">lab-rtpengine .161</text>
  <text x="502" y="657" text-anchor="middle" class="c">NG :2223</text>
  <text x="502" y="675" text-anchor="middle" class="c">RTP :30000–30100</text>
  <rect x="410" y="705" width="185" height="80" rx="6" class="box"/>
  <text x="502" y="726" text-anchor="middle" class="t">Media Adapter</text>
  <text x="502" y="744" text-anchor="middle" class="c">lab-media-adapter</text>
  <text x="502" y="762" text-anchor="middle" class="c">.161 : 8091</text>
  <text x="502" y="778" text-anchor="middle" class="d">network_mode: rtpengine</text>

  <!-- HSS / DNS / AS / Voice column -->
  <rect x="690" y="95" width="190" height="95" rx="6" class="box"/>
  <text x="785" y="116" text-anchor="middle" class="t">HSS (PyHSS)</text>
  <text x="785" y="134" text-anchor="middle" class="c">lab-pyhss .163</text>
  <text x="785" y="152" text-anchor="middle" class="c">Cx (Diameter) :3868</text>
  <text x="785" y="170" text-anchor="middle" class="c">REST :8080 →</text>
  <text x="785" y="185" text-anchor="middle" class="c">хост 127.0.0.1:8088</text>

  <rect x="690" y="225" width="190" height="60" rx="6" class="box"/>
  <text x="785" y="247" text-anchor="middle" class="t">MySQL (база HSS)</text>
  <text x="785" y="267" text-anchor="middle" class="c">lab-mysql .162 :3306</text>

  <rect x="690" y="335" width="190" height="75" rx="6" class="box"/>
  <text x="785" y="357" text-anchor="middle" class="t">DNS IMS (dnsmasq)</text>
  <text x="785" y="375" text-anchor="middle" class="c">lab-dns</text>
  <text x="785" y="393" text-anchor="middle" class="c">.160 : 53</text>

  <rect x="690" y="455" width="190" height="75" rx="6" class="box"/>
  <text x="785" y="477" text-anchor="middle" class="t">SIP AS</text>
  <text x="785" y="495" text-anchor="middle" class="c">lab-sip-as</text>
  <text x="785" y="513" text-anchor="middle" class="c">.167 : 5070</text>

  <rect x="690" y="600" width="190" height="85" rx="6" class="box"/>
  <text x="785" y="621" text-anchor="middle" class="t">Voice Agent (TTS)</text>
  <text x="785" y="639" text-anchor="middle" class="c">lab-voice-agent .169</text>
  <text x="785" y="657" text-anchor="middle" class="c">HTTP :8093</text>
  <text x="785" y="675" text-anchor="middle" class="c">RTP с :41000</text>

  <rect x="690" y="815" width="190" height="50" rx="12" fill="#f7f7f7" stroke="#888" stroke-dasharray="4 3"/>
  <text x="785" y="836" text-anchor="middle" class="d">диск хоста</text>
  <text x="785" y="853" text-anchor="middle" class="c">local/private/recordings</text>

  <!-- Test clients -->
  <rect x="190" y="640" width="185" height="210" rx="8" fill="none" stroke="#1f5fbf" stroke-dasharray="6 4"/>
  <text x="282" y="660" text-anchor="middle" class="d" fill="#1f5fbf">только на время теста (profile test)</text>
  <rect x="200" y="670" width="165" height="75" rx="6" class="box"/>
  <text x="282" y="691" text-anchor="middle" class="t">PJSUA, абонент 1101</text>
  <text x="282" y="709" text-anchor="middle" class="c">lab-sipue1</text>
  <text x="282" y="727" text-anchor="middle" class="c">.170</text>
  <rect x="200" y="760" width="165" height="75" rx="6" class="box"/>
  <text x="282" y="781" text-anchor="middle" class="t">PJSUA, абонент 1102</text>
  <text x="282" y="799" text-anchor="middle" class="c">lab-sipue2</text>
  <text x="282" y="817" text-anchor="middle" class="c">.171</text>

  <!-- AI backend network -->
  <rect x="1060" y="560" width="360" height="360" rx="14" fill="#fdf3e7" stroke="#c9822b" stroke-width="2"/>
  <text x="1080" y="895" class="net" fill="#8a5414">Сеть «lab-ai-backend»</text>
  <text x="1080" y="912" class="netsub" fill="#8a5414">internal: без выхода в интернет</text>
  <rect x="1225" y="700" width="180" height="100" rx="6" class="box"/>
  <text x="1315" y="721" text-anchor="middle" class="t">LLM (Ollama)</text>
  <text x="1315" y="739" text-anchor="middle" class="c">lab-llm-worker</text>
  <text x="1315" y="757" text-anchor="middle" class="c">llm-worker:11434</text>
  <text x="1315" y="775" text-anchor="middle" class="d">Qwen3-4B, baseline</text>
  <text x="1315" y="790" text-anchor="middle" class="d">том llm-model-cache</text>

  <!-- AI Worker straddles both networks -->
  <rect x="950" y="700" width="200" height="95" rx="6" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="1050" y="721" text-anchor="middle" class="t">AI Worker (STT+перевод)</text>
  <text x="1050" y="739" text-anchor="middle" class="c">lab-ai-worker</text>
  <text x="1050" y="757" text-anchor="middle" class="c">oai-cn5g: .168 :8092</text>
  <text x="1050" y="775" text-anchor="middle" class="c">lab-ai-backend: IP Docker</text>

  <!-- One-shot containers: model loader in the core network, stand-init without network -->
  <rect x="1100" y="80" width="300" height="140" rx="6" class="box"/>
  <text x="1250" y="102" text-anchor="middle" class="t">lab-llm-model-init</text>
  <text x="1250" y="120" text-anchor="middle" class="c">.172 (разовый)</text>
  <text x="1250" y="142" text-anchor="middle" class="d">скачивает GGUF через NAT</text>
  <text x="1250" y="159" text-anchor="middle" class="d">сети ядра, проверяет SHA-256,</text>
  <text x="1250" y="176" text-anchor="middle" class="d">кладёт в том llm-model-cache</text>
  <text x="1250" y="200" text-anchor="middle" class="d">завершается до старта LLM</text>

  <rect x="1080" y="265" width="200" height="140" rx="14" fill="#f3f3f3" stroke="#999" stroke-dasharray="6 4"/>
  <text x="1095" y="287" class="net" fill="#555">network_mode: none</text>
  <rect x="1095" y="305" width="170" height="85" rx="6" class="box"/>
  <text x="1180" y="326" text-anchor="middle" class="c">lab-stand-init</text>
  <text x="1180" y="346" text-anchor="middle" class="d">разово: токен</text>
  <text x="1180" y="362" text-anchor="middle" class="d">служебных API и</text>
  <text x="1180" y="378" text-anchor="middle" class="d">права каталога записей</text>

  <!-- Legend -->
  <rect x="1295" y="250" width="125" height="285" rx="8" fill="#fff" stroke="#bbb"/>
  <text x="1357" y="270" text-anchor="middle" class="t">Обозначения</text>
  <line x1="1305" y1="290" x2="1345" y2="290" stroke="#1f5fbf" stroke-width="2" marker-end="url(#sip)"/><text x="1350" y="294" class="d">SIP</text>
  <line x1="1305" y1="315" x2="1345" y2="315" stroke="#7b3fb5" stroke-width="2" marker-end="url(#dia)"/><text x="1350" y="319" class="d">Cx, SQL</text>
  <line x1="1305" y1="340" x2="1345" y2="340" stroke="#666" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dns)"/><text x="1350" y="344" class="d">DNS</text>
  <line x1="1305" y1="365" x2="1345" y2="365" stroke="#2e8b3e" stroke-width="3.5" marker-end="url(#rtp)"/><text x="1350" y="369" class="d">RTP</text>
  <line x1="1305" y1="390" x2="1345" y2="390" stroke="#d2691e" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#http)"/><text x="1350" y="394" class="d">HTTP</text>
  <circle cx="1315" cy="418" r="9" fill="#333"/><text x="1315" y="422" text-anchor="middle" class="num">7</text>
  <text x="1330" y="414" class="d">шаг вызова</text><text x="1330" y="429" class="d">из текста</text>
  <text x="1305" y="455" class="d">IP .NNN =</text>
  <text x="1305" y="471" class="c">192.168.70.NNN</text>
  <text x="1305" y="495" class="d">Значения из</text>
  <text x="1305" y="511" class="c">app/config/</text>
  <text x="1305" y="525" class="c">lab.env</text>

  <!-- 1: phone to UPF -->
  <line x1="160" y1="365" x2="206" y2="365" stroke="#2e8b3e" stroke-width="3.5" marker-start="url(#rtp)" marker-end="url(#rtp)"/>
  <circle cx="183" cy="347" r="9" fill="#333"/><text x="183" y="351" text-anchor="middle" class="num">1</text>
  <text x="90" y="440" text-anchor="middle" class="lbl">N3 (GTP-U): SIP и RTP</text>
  <text x="90" y="456" text-anchor="middle" class="lbl">внутри PDU-сессии ims</text>

  <!-- 2: UPF <-> P-CSCF, SIP -->
  <line x1="358" y1="372" x2="408" y2="372" stroke="#1f5fbf" stroke-width="2" marker-start="url(#sip)" marker-end="url(#sip)"/>
  <circle cx="383" cy="354" r="9" fill="#333"/><text x="383" y="358" text-anchor="middle" class="num">2</text>
  <text x="384" y="326" text-anchor="middle" class="lbl" fill="#1f5fbf">SIP 5060</text>

  <!-- 3: P-CSCF -> DNS and P-CSCF -> I-CSCF -->
  <line x1="595" y1="372" x2="688" y2="372" stroke="#666" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dns)"/>
  <circle cx="618" cy="356" r="9" fill="#333"/><text x="618" y="360" text-anchor="middle" class="num">3</text>
  <text x="642" y="390" text-anchor="middle" class="lbl" fill="#555">SRV _sip._udp</text>
  <line x1="502" y1="333" x2="502" y2="292" stroke="#1f5fbf" stroke-width="2" marker-end="url(#sip)"/>
  <circle cx="487" cy="312" r="9" fill="#333"/><text x="487" y="316" text-anchor="middle" class="num">3</text>
  <text x="545" y="316" text-anchor="middle" class="lbl" fill="#1f5fbf">REGISTER</text>

  <!-- 4: I-CSCF -> HSS (UAR) and I-CSCF -> S-CSCF -->
  <line x1="595" y1="240" x2="688" y2="170" stroke="#7b3fb5" stroke-width="2" marker-start="url(#dia)" marker-end="url(#dia)"/>
  <circle cx="625" cy="232" r="9" fill="#333"/><text x="625" y="236" text-anchor="middle" class="num">4</text>
  <text x="655" y="222" text-anchor="middle" class="lbl" fill="#7b3fb5">UAR</text>
  <line x1="502" y1="213" x2="502" y2="172" stroke="#1f5fbf" stroke-width="2" marker-end="url(#sip)"/>
  <circle cx="487" cy="192" r="9" fill="#333"/><text x="487" y="196" text-anchor="middle" class="num">4</text>
  <text x="545" y="196" text-anchor="middle" class="lbl" fill="#1f5fbf">REGISTER</text>

  <!-- 5: S-CSCF <-> HSS (MAR/SAR), HSS <-> MySQL -->
  <line x1="595" y1="125" x2="688" y2="125" stroke="#7b3fb5" stroke-width="2" marker-start="url(#dia)" marker-end="url(#dia)"/>
  <circle cx="618" cy="109" r="9" fill="#333"/><text x="618" y="113" text-anchor="middle" class="num">5</text>
  <text x="652" y="143" text-anchor="middle" class="lbl" fill="#7b3fb5">MAR/SAR</text>
  <line x1="785" y1="192" x2="785" y2="223" stroke="#7b3fb5" stroke-width="2" marker-start="url(#dia)" marker-end="url(#dia)"/>
  <text x="815" y="212" text-anchor="middle" class="lbl" fill="#7b3fb5">SQL</text>

  <!-- 7: P-CSCF -> RTPengine NG -->
  <line x1="502" y1="412" x2="502" y2="598" stroke="#d2691e" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#http)"/>
  <circle cx="487" cy="440" r="9" fill="#333"/><text x="487" y="444" text-anchor="middle" class="num">7</text>
  <text x="552" y="470" text-anchor="middle" class="lbl" fill="#a24f0f">NG: offer/</text>
  <text x="552" y="485" text-anchor="middle" class="lbl" fill="#a24f0f">answer SDP</text>

  <!-- 8: S-CSCF -> SIP AS (ISC), routed over the top -->
  <path d="M 520 93 L 520 72 L 910 72 L 910 492 L 882 492" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#sip)"/>
  <circle cx="540" cy="72" r="9" fill="#333"/><text x="540" y="76" text-anchor="middle" class="num">8</text>
  <text x="720" y="67" text-anchor="middle" class="lbl" fill="#1f5fbf">ISC: INVITE по iFC → as.&lt;домен&gt;:5070</text>

  <!-- 9: SIP AS -> Media Adapter and Voice Agent -->
  <line x1="700" y1="532" x2="597" y2="712" stroke="#d2691e" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#http)"/>
  <circle cx="680" cy="555" r="9" fill="#333"/><text x="680" y="559" text-anchor="middle" class="num">9</text>
  <text x="622" y="560" text-anchor="middle" class="lbl" fill="#a24f0f">/sessions</text>
  <line x1="800" y1="532" x2="800" y2="598" stroke="#d2691e" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#http)"/>
  <circle cx="785" cy="565" r="9" fill="#333"/><text x="785" y="569" text-anchor="middle" class="num">9</text>
  <text x="840" y="569" text-anchor="middle" class="lbl" fill="#a24f0f">/calls</text>

  <!-- 10: RTP UPF <-> RTPengine, copy to AI Worker -->
  <path d="M 283 402 L 283 520 L 385 520 L 385 630 L 408 630" fill="none" stroke="#2e8b3e" stroke-width="3.5" marker-start="url(#rtp)" marker-end="url(#rtp)"/>
  <circle cx="300" cy="520" r="9" fill="#333"/><text x="300" y="524" text-anchor="middle" class="num">10</text>
  <text x="330" y="545" text-anchor="middle" class="lbl" fill="#2e8b3e">RTP абонента</text>
  <line x1="460" y1="687" x2="460" y2="703" stroke="#2e8b3e" stroke-width="2.5" marker-end="url(#rtp)"/>
  <text x="540" y="698" text-anchor="middle" class="lbl" fill="#2e8b3e">копия RTP</text>
  <line x1="597" y1="745" x2="948" y2="745" stroke="#d2691e" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#http)"/>
  <circle cx="620" cy="745" r="9" fill="#333"/><text x="620" y="749" text-anchor="middle" class="num">10</text>
  <text x="780" y="738" text-anchor="middle" class="lbl" fill="#a24f0f">POST /observe: PCMU окнами по 100 мс</text>

  <!-- 11: AI Worker -> LLM -->
  <line x1="1152" y1="745" x2="1223" y2="745" stroke="#d2691e" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#http)"/>
  <circle cx="1170" cy="728" r="9" fill="#333"/><text x="1170" y="732" text-anchor="middle" class="num">11</text>
  <text x="1188" y="770" text-anchor="middle" class="lbl" fill="#a24f0f">/api/chat</text>

  <!-- 12: AI Worker -> Voice Agent text, Voice Agent -> RTPengine RTP -->
  <line x1="955" y1="702" x2="882" y2="660" stroke="#d2691e" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#http)"/>
  <circle cx="930" cy="672" r="9" fill="#333"/><text x="930" y="676" text-anchor="middle" class="num">12</text>
  <text x="955" y="655" text-anchor="middle" class="lbl" fill="#a24f0f">текст ответа</text>
  <line x1="688" y1="642" x2="597" y2="642" stroke="#2e8b3e" stroke-width="3.5" marker-end="url(#rtp)"/>
  <circle cx="616" cy="626" r="9" fill="#333"/><text x="616" y="630" text-anchor="middle" class="num">12</text>
  <text x="645" y="662" text-anchor="middle" class="lbl" fill="#2e8b3e">PCMU</text>

  <!-- 1004 recording -->
  <line x1="990" y1="797" x2="882" y2="840" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#dns)"/>
  <text x="975" y="835" text-anchor="middle" class="lbl" fill="#555">только 1004</text>

  <!-- Test clients -->
