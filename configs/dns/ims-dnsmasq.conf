# IMS DNS zone for the docker lab, served on the lab5g bridge address.
# docker_open5gs uses BIND9; the lab uses dnsmasq consistent with the ims repo
# Phase 4A design (config/dns/ims-dnsmasq.conf), but names resolve to the static
# per-service container IPs instead of a single host address.
bind-dynamic
listen-address=__LOOPBACK_IP__
listen-address=__DNS_IP__
no-resolv
server=__DNS_UPSTREAM_PRIMARY__
server=__DNS_UPSTREAM_SECONDARY__
log-queries

local=/__IMS_DOMAIN__/
domain=__IMS_DOMAIN__

# Per-function A records (ports distinguish functions per ims-connectivity-v1.md)
# The home-domain A record is required by the S-CSCF terminating leg after
# originating service processing; it lands on the I-CSCF.
address=/__IMS_DOMAIN__/__ICSCF_IP__
address=/pcscf.__IMS_DOMAIN__/__PCSCF_IP__
address=/icscf.__IMS_DOMAIN__/__ICSCF_IP__
address=/scscf.__IMS_DOMAIN__/__SCSCF_IP__
address=/hss.__IMS_DOMAIN__/__PYHSS_IP__
address=/as.__IMS_DOMAIN__/__SIP_AS_IP__
address=/media.__IMS_DOMAIN__/__RTPENGINE_IP__
address=/voice-agent.__IMS_DOMAIN__/__VOICE_AGENT_IP__

# SIP service location: REGISTER RURI (home domain) resolves to the I-CSCF
# (Kamailio P-CSCF relays by RURI with dns_srv_lb=on).
srv-host=_sip._udp.__IMS_DOMAIN__,icscf.__IMS_DOMAIN__,__ICSCF_SIP_PORT__
srv-host=_sip._tcp.__IMS_DOMAIN__,icscf.__IMS_DOMAIN__,__ICSCF_SIP_PORT__
srv-host=_sip._udp.scscf.__IMS_DOMAIN__,scscf.__IMS_DOMAIN__,__SCSCF_SIP_PORT__
srv-host=_sip._tcp.scscf.__IMS_DOMAIN__,scscf.__IMS_DOMAIN__,__SCSCF_SIP_PORT__
