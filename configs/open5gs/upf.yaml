logger:
  level: info
global:
  max:
    ue: 1024
upf:
  pfcp:
    server:
      - dev: eth0
  gtpu:
    server:
      - dev: eth0
        port: 2152
  session:
    - subnet: __INTERNET_UE_CIDR__
      gateway: __INTERNET_UE_GATEWAY__
      dnn: __INTERNET_DNN__
      dev: ogstun
    - subnet: __IMS_UE_CIDR__
      gateway: __IMS_UE_GATEWAY__
      dnn: __IMS_DNN__
      dev: ogstun2
  metrics:
    server:
      - dev: eth0
        port: 9090
