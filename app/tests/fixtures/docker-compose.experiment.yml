services:
  sipue1:
    environment:
      SIP_UE_PLAYBACK_FILE: /experiment/input/russian-user-speaks.wav
      SIP_UE_RECORD_FILE: /experiment/output/russian-user-hears.wav
      SIP_UE_AUTO_CONFERENCE: 0
    volumes:
      - ${EXPERIMENT_DIRECTORY}:/experiment

  sipue2:
    environment:
      SIP_UE_PLAYBACK_FILE: /experiment/input/english-user-speaks.wav
      SIP_UE_RECORD_FILE: /experiment/output/english-user-hears.wav
      SIP_UE_AUTO_CONFERENCE: 0
    volumes:
      - ${EXPERIMENT_DIRECTORY}:/experiment
