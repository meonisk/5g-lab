# ims: service definitions; paths resolve from the repository root.
x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: ${CUSTOM_SERVICE_LOG_MAX_SIZE}
    max-file: ${CUSTOM_SERVICE_LOG_MAX_FILES}

x-sip-ue: &sip-ue
  build: app/infrastructure/images/pjsua
  image: lab-pjsua
  profiles: [test]
  restart: unless-stopped
  # tini forwards SIGTERM to PJSUA so docker stop ends the client cleanly.
  init: true
  depends_on: [pcscf]
  env_file: [app/config/lab.env]
  volumes:
    - ./scripts/sip-ue-run.sh:/lab/sip-ue-run.sh:ro
    - ./local/private/interpreter:/fixtures:ro
  entrypoint: ["/lab/sip-ue-run.sh"]
  logging: *bounded-logging

services:
  dns:
    build: app/infrastructure/images/dnsmasq
    container_name: lab-dns
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    # Route back to the UE ims pool through the UPF (ims DNN has no NAT).
    entrypoint: ["/lab/dns-ims-run.sh"]
    env_file:
      - app/config/lab.env
    environment:
      UPF_IP: ${UPF_IP}
    volumes:
      - ./app/infrastructure/configs/dns/ims-dnsmasq.conf:/etc/dnsmasq.d/ims.conf:ro
      - ./scripts/dns-ims-run.sh:/lab/dns-ims-run.sh:ro
    networks:
      lab5g:
        ipv4_address: ${DNS_IP}
    logging: *bounded-logging

  mysql:
    image: ${MYSQL_IMAGE}
    container_name: lab-mysql
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      lab5g:
        ipv4_address: ${MYSQL_IP}
    logging: *bounded-logging

  pyhss:
    image: ${PYHSS_IMAGE}
    container_name: lab-pyhss
    restart: unless-stopped
    env_file:
      - app/config/lab.env
    volumes:
      - ./app/infrastructure/vendor/docker_open5gs/pyhss:/mnt/pyhss:ro
    tmpfs:
      - /pyhss/log:rw,noexec,nosuid,nodev,size=64m
    ports:
      - "${PYHSS_API_BIND}:${PYHSS_API_PORT}:${PYHSS_API_CONTAINER_PORT}/tcp"
    expose:
      - "${PYHSS_BIND_PORT}/tcp"
    depends_on: [dns, mysql]
    networks:
      lab5g:
        ipv4_address: ${PYHSS_IP}
    logging: *bounded-logging

  # Kamailio P/I/S-CSCF from the vendored docker_open5gs configs; the image
  # entrypoint dispatches on COMPONENT_NAME and the init scripts template the
  # configs from app/config/lab.env. CSCFs resolve IMS FQDNs through the lab
  # dnsmasq (dns: override) and route back to the UE pools via the UPF.

  icscf:
    image: ${KAMAILIO_IMAGE}
    container_name: lab-icscf
    restart: unless-stopped
    env_file:
      - app/config/lab.env
    environment:
      - UPF_IP=${UPF_IP}
      - COMPONENT_NAME=icscf
    cap_add: [NET_ADMIN]
    dns:
      - ${DNS_IP}
    volumes:
      - ./app/infrastructure/vendor/docker_open5gs/icscf:/mnt/icscf:ro
    expose:
      - "${ICSCF_SIP_PORT}/udp"
      - "${ICSCF_SIP_PORT}/tcp"
      - "${ICSCF_BIND_PORT}/tcp"
    depends_on: [dns, mysql, pyhss]
    networks:
      lab5g:
        ipv4_address: ${ICSCF_IP}
    logging: *bounded-logging

  scscf:
    image: ${SCSCF_IMAGE}
    build:
      context: .
      dockerfile: app/infrastructure/images/kamailio-scscf/Dockerfile
    container_name: lab-scscf
    restart: unless-stopped
    env_file:
      - app/config/lab.env
    environment:
      - UPF_IP=${UPF_IP}
      - COMPONENT_NAME=scscf
    cap_add: [NET_ADMIN]
    dns:
      - ${DNS_IP}
    volumes:
      - ./app/infrastructure/vendor/docker_open5gs/scscf:/mnt/scscf:ro
    expose:
      - "${SCSCF_SIP_PORT}/udp"
      - "${SCSCF_SIP_PORT}/tcp"
      - "${SCSCF_BIND_PORT}/tcp"
    depends_on: [dns, mysql, pyhss]
    networks:
      lab5g:
        ipv4_address: ${SCSCF_IP}
    logging: *bounded-logging

  pcscf:
    image: ${KAMAILIO_IMAGE}
    container_name: lab-pcscf
    restart: unless-stopped
    env_file:
      - app/config/lab.env
    environment:
      - UPF_IP=${UPF_IP}
      - COMPONENT_NAME=pcscf
      - PCSCF_PUB_IP=${PCSCF_IP}
    cap_add: [NET_ADMIN]
    dns:
      - ${DNS_IP}
    volumes:
      - ./app/infrastructure/vendor/docker_open5gs/pcscf:/mnt/pcscf:ro
    expose:
      - "${PCSCF_SIP_PORT}/udp"
      - "${PCSCF_SIP_PORT}/tcp"
      - "${PCSCF_BIND_PORT}/tcp"
    depends_on: [dns, mysql, icscf, scscf, rtpengine]
    networks:
      lab5g:
        ipv4_address: ${PCSCF_IP}
    logging: *bounded-logging

  # Userspace RTP relay. Media is routed back to both UE pools through the UPF;
  # no host/kernel xt_RTPENGINE module is required.
  rtpengine:
    build: app/infrastructure/vendor/docker_open5gs/rtpengine
    image: lab-rtpengine
    container_name: lab-rtpengine
    restart: unless-stopped
    env_file:
      - app/config/lab.env
    cap_add: [NET_ADMIN]
    environment:
      UPF_IP: ${UPF_IP}
      INTERFACE: ${RTPENGINE_IP}
      LISTEN_NG: ${RTPENGINE_IP}:${RTPENGINE_NG_PORT}
      LISTEN_CLI: ${RTPENGINE_IP}:${RTPENGINE_CLI_PORT}
      PORT_MIN: ${RTPENGINE_PORT_MIN}
      PORT_MAX: ${RTPENGINE_PORT_MAX}
      TABLE: "-1"
    volumes:
      - ./app/infrastructure/vendor/docker_open5gs/rtpengine:/mnt/rtpengine:ro
    networks:
      lab5g:
        ipv4_address: ${RTPENGINE_IP}
    logging: *bounded-logging

  # Test SIP clients (profile "test"): PJSUA registers with SIP Digest straight
  # from the core bridge, without a 5G UE. Phones use UE1/UE2; these use SIPUE*.
  sipue1:
    <<: *sip-ue
    container_name: lab-sipue1
    environment:
      IMSI: ${SIPUE1_IMSI}
      SIP_UE_IP: ${SIPUE1_IP}
      IMS_DIGEST_PASSWORD: ${SIPUE1_IMS_K}
      SIP_UE_PLAYBACK_FILE: ${SIPUE1_PLAYBACK_FILE:-}
      SIP_UE_AUTO_CONFERENCE: ${SIPUE_AUTO_CONFERENCE:-1}
    networks:
      lab5g:
        ipv4_address: ${SIPUE1_IP}

  sipue2:
    <<: *sip-ue
    container_name: lab-sipue2
    environment:
      IMSI: ${SIPUE2_IMSI}
      SIP_UE_IP: ${SIPUE2_IP}
      IMS_DIGEST_PASSWORD: ${SIPUE2_IMS_K}
      SIP_UE_PLAYBACK_FILE: ${SIPUE2_PLAYBACK_FILE:-}
      SIP_UE_AUTO_CONFERENCE: ${SIPUE_AUTO_CONFERENCE:-1}
    networks:
      lab5g:
        ipv4_address: ${SIPUE2_IP}
