# Partner overlay for ai.yml (compose.partner.yml only).
# The macvlan default gateway leads to the partner UE pool, not to the internet:
# model downloads leave through a separate NAT bridge instead.
services:
  # ai-worker runs as 65532 and must create private session directories.
  recordings-init:
    image: ${CONTROL_INIT_IMAGE}
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    command: [chown, "65532:65532", "${RECORDING_ROOT}"]
    volumes:
      - ./local/private/recordings:${RECORDING_ROOT}

  ai-worker:
    depends_on:
      recordings-init: {condition: service_completed_successfully}
    networks:
      ai-egress:
        gw_priority: 1

  llm-model-init:
    networks:
      ai-egress:
        gw_priority: 1

networks:
  ai-egress:
    name: lab-ai-egress
    driver: bridge
