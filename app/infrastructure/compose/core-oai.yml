# OAI CN5G v2.2.1. Private configuration is generated by initialize_local.py.
x-oai: &oai
  restart: unless-stopped
  networks: [lab5g]
  logging:
    driver: json-file
    options:
      max-size: ${CUSTOM_SERVICE_LOG_MAX_SIZE}
      max-file: ${CUSTOM_SERVICE_LOG_MAX_FILES}

services:
  oai-db:
    <<: *oai
    image: ${OAI_MYSQL_IMAGE}
    container_name: lab-oai-db
    environment:
      MYSQL_DATABASE: oai_db
      MYSQL_USER: oai
      MYSQL_PASSWORD: ${OAI_DB_PASSWORD:?Run scripts/initialize_local.py}
      MYSQL_ROOT_PASSWORD: ${OAI_DB_ROOT_PASSWORD:?Run scripts/initialize_local.py}
    volumes:
      - oai-mysql-data:/var/lib/mysql
      - ./app/infrastructure/vendor/oai-cn5g/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -u oai oai_db -e "SELECT 1 FROM AuthenticationSubscription LIMIT 1"']
      interval: 5s
      timeout: 3s
      retries: 40

  nrf:
    <<: *oai
    image: ${OAI_NRF_IMAGE}
    container_name: lab-nrf
    volumes:
      - ./local/oai/nrf.yaml:/openair-nrf/etc/config.yaml:ro

  udr:
    <<: *oai
    image: ${OAI_UDR_IMAGE}
    container_name: lab-udr
    volumes:
      - ./local/oai/udr.yaml:/openair-udr/etc/config.yaml:ro
    depends_on:
      nrf: {condition: service_healthy}
      oai-db: {condition: service_healthy}

  udm:
    <<: *oai
    image: ${OAI_UDM_IMAGE}
    container_name: lab-udm
    volumes:
      - ./local/oai/udm.yaml:/openair-udm/etc/config.yaml:ro
    depends_on:
      nrf: {condition: service_healthy}

  ausf:
    <<: *oai
    image: ${OAI_AUSF_IMAGE}
    container_name: lab-ausf
    volumes:
      - ./local/oai/ausf.yaml:/openair-ausf/etc/config.yaml:ro
    depends_on:
      nrf: {condition: service_healthy}

  amf:
    <<: *oai
    image: ${OAI_AMF_IMAGE}
    container_name: lab-amf
    volumes:
      - ./local/oai/amf.yaml:/openair-amf/etc/config.yaml:ro
    depends_on:
      nrf: {condition: service_healthy}

  smf:
    <<: *oai
    image: ${OAI_SMF_IMAGE}
    container_name: lab-smf
    volumes:
      - ./local/oai/smf.yaml:/openair-smf/etc/config.yaml:ro
    depends_on:
      nrf: {condition: service_healthy}

  upf:
    <<: *oai
    image: ${OAI_UPF_IMAGE}
    container_name: lab-upf
    volumes:
      - ./local/oai/upf.yaml:/openair-upf/etc/config.yaml:ro
      - ./scripts/oai-upf-run.sh:/lab/oai-upf-run.sh:ro
      - ./scripts/oai-upf-network.sh:/lab/oai-upf-network.sh:ro
      - ./scripts/oai-upf-health.sh:/lab/oai-upf-health.sh:ro
    env_file: [app/config/lab.env]
    entrypoint: [bash, /lab/oai-upf-run.sh]
    depends_on:
      nrf: {condition: service_healthy}
    privileged: true
    cap_add: [NET_ADMIN, SYS_ADMIN]
    devices: [/dev/net/tun]
    sysctls:
      net.ipv4.ip_forward: 1
    # Upstream healthcheck greps YAML text and skips simple-switch checks.
    # Probe its actual TUN and N3/N4 listeners instead.
    healthcheck:
      test: [CMD, bash, /lab/oai-upf-health.sh]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      lab5g:
        ipv4_address: ${UPF_IP}
