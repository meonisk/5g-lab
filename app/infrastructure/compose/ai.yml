# ai: service definitions; paths resolve from the repository root.
x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: ${CUSTOM_SERVICE_LOG_MAX_SIZE}
    max-file: ${CUSTOM_SERVICE_LOG_MAX_FILES}

x-custom-service: &custom-service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  pids_limit: ${CUSTOM_SERVICE_PIDS_LIMIT}
  cpus: ${CUSTOM_SERVICE_CPU_LIMIT}
  mem_limit: ${CUSTOM_SERVICE_MEMORY_LIMIT}
  logging: *bounded-logging

services:
  # One-shot preparation without network: the internal service token in its
  # volume, and the recordings folder handed to ai-worker (uid 65532).
  stand-init:
    image: ${CONTROL_INIT_IMAGE}
    container_name: lab-stand-init
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    environment:
      TOKEN_BYTES: ${SERVICE_CONTROL_TOKEN_BYTES}
      RECORDINGS: ${RECORDING_ROOT}
    command: >-
      sh -eu -c 'umask 077; mkdir -p /run/lab-control;
      if [ ! -s /run/lab-control/token ]; then
      head -c "$${TOKEN_BYTES}" /dev/urandom | base64 > /run/lab-control/token;
      fi; chmod 0555 /run/lab-control; chmod 0444 /run/lab-control/token;
      chown 65532:65532 "$${RECORDINGS}"'
    volumes:
      - service-control-secret:/run/lab-control
      - ./local/private/recordings:${RECORDING_ROOT}

  sip-as:
    <<: *custom-service
    build:
      context: app/services
      dockerfile: sip-as/Dockerfile
    image: lab-sip-as
    container_name: lab-sip-as
    user: "65532:65532"
    env_file: [app/config/lab.env]
    environment:
      MEDIA_ADAPTER_URL: http://${RTPENGINE_IP}:${MEDIA_ADAPTER_PORT}
      VOICE_AGENT_URL: http://${VOICE_AGENT_IP}:${VOICE_AGENT_HTTP_PORT}
    depends_on:
      scscf: {condition: service_started}
      media-adapter: {condition: service_started}
      voice-agent: {condition: service_started}
      stand-init: {condition: service_completed_successfully}
    volumes:
      - service-control-secret:/run/lab-control:ro
    networks:
      lab5g:
        ipv4_address: ${SIP_AS_IP}

  media-adapter:
    <<: *custom-service
    build:
      context: app/services
      dockerfile: media-adapter/Dockerfile
    image: lab-media-adapter
    container_name: lab-media-adapter
    env_file: [app/config/lab.env]
    environment:
      AI_WORKER_URL: http://${AI_WORKER_IP}:${AI_WORKER_PORT}
    network_mode: service:rtpengine
    cap_add: [NET_RAW]
    depends_on:
      rtpengine: {condition: service_started}
      ai-worker: {condition: service_started}
      stand-init: {condition: service_completed_successfully}
    volumes:
      - service-control-secret:/run/lab-control:ro

  ai-worker:
    <<: *custom-service
    build:
      context: app/services
      dockerfile: ai-worker/Dockerfile
      args:
        AI_ENABLE_CUDA: ${AI_ENABLE_CUDA}
    image: lab-ai-worker
    runtime: ${AI_CONTAINER_RUNTIME}
    container_name: lab-ai-worker
    user: "65532:65532"
    cpus: ${AI_WORKER_CPU_LIMIT}
    mem_limit: ${AI_WORKER_MEMORY_LIMIT}
    env_file: [app/config/lab.env]
    environment:
      HOME: /tmp
      AI_DEVICE: ${AI_DEVICE}
      AI_COMPUTE_TYPE: ${AI_COMPUTE_TYPE}
      NVIDIA_VISIBLE_DEVICES: ${AI_GPU_DEVICES}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: ${AI_MODEL_CACHE}
      HUGGINGFACE_HUB_CACHE: ${AI_MODEL_CACHE}
      XDG_CACHE_HOME: ${AI_MODEL_CACHE}
      HF_HUB_DISABLE_XET: ${AI_HF_DISABLE_XET}
      VOICE_AGENT_URL: http://${VOICE_AGENT_IP}:${VOICE_AGENT_HTTP_PORT}
    depends_on:
      stand-init: {condition: service_completed_successfully}
      llm-worker: {condition: service_started}
    volumes:
      - service-control-secret:/run/lab-control:ro
      - ai-model-cache:${AI_MODEL_CACHE}
      - ./local/private/recordings:${RECORDING_ROOT}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    networks:
      lab5g:
        ipv4_address: ${AI_WORKER_IP}
      ai-backend: {}
    healthcheck:
      test: [CMD, python, -c, "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['AI_WORKER_PORT']+'/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 180s

  # Ollama is intentionally reachable only by the AI Worker on an internal
  # network. The one-shot initializer is the only LLM component allowed outbound
  # access; it leaves through the core bridge NAT and exits before LLM starts.
  llm-model-init:
    build:
      context: app/infrastructure/images/llm-init
      args:
        OLLAMA_IMAGE: ${OLLAMA_IMAGE}
    image: lab-llm-init
    container_name: lab-llm-model-init
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      LLM_MODEL: ${LLM_MODEL}
      LLM_GGUF_URL: ${LLM_GGUF_URL}
      LLM_GGUF_SHA256: ${LLM_GGUF_SHA256}
    volumes:
      - llm-model-cache:/root/.ollama
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    networks:
      lab5g:
        ipv4_address: ${LLM_INIT_IP}

  llm-worker:
    image: ${OLLAMA_IMAGE}
    container_name: lab-llm-worker
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: ${CUSTOM_SERVICE_PIDS_LIMIT}
    cpus: ${LLM_WORKER_CPU_LIMIT}
    mem_limit: ${LLM_WORKER_MEMORY_LIMIT}
    runtime: ${LLM_CONTAINER_RUNTIME}
    depends_on:
      llm-model-init: {condition: service_completed_successfully}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${LLM_GPU_DEVICES}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: ${LLM_CONTEXT_LENGTH}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${LLM_KEEP_ALIVE}
      OLLAMA_NUM_PARALLEL: ${LLM_NUM_PARALLEL}
      OLLAMA_MAX_QUEUE: ${AI_QUEUE_MAX}
    volumes:
      - llm-model-cache:/root/.ollama
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    networks: [ai-backend]
    logging: *bounded-logging

  voice-agent:
    <<: *custom-service
    build:
      context: app/services
      dockerfile: voice-agent/Dockerfile
      args:
        PIPER_VERSION: ${PIPER_VERSION}
        PIPER_MODEL_URL: ${PIPER_MODEL_URL}
        PIPER_MODEL_SHA256: ${PIPER_MODEL_SHA256}
        PIPER_CONFIG_SHA256: ${PIPER_CONFIG_SHA256}
        PIPER_MODEL_PATH: ${PIPER_MODEL_PATH}
        PIPER_EN_MODEL_URL: ${PIPER_EN_MODEL_URL}
        PIPER_EN_MODEL_SHA256: ${PIPER_EN_MODEL_SHA256}
        PIPER_EN_CONFIG_SHA256: ${PIPER_EN_CONFIG_SHA256}
        PIPER_EN_MODEL_PATH: ${PIPER_EN_MODEL_PATH}
    image: lab-voice-agent
    container_name: lab-voice-agent
    user: "65532:65532"
    mem_limit: ${VOICE_AGENT_MEMORY_LIMIT}
    env_file: [app/config/lab.env]
    depends_on:
      stand-init: {condition: service_completed_successfully}
    volumes:
      - service-control-secret:/run/lab-control:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      lab5g:
        ipv4_address: ${VOICE_AGENT_IP}
