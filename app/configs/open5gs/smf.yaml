logger:
  level: info
global:
  max:
    ue: 1024
smf:
  sbi:
    server:
      - dev: eth0
        port: 7777
    client:
      scp:
        - uri: http://scp:7777
  pfcp:
    server:
      - dev: eth0
    client:
      upf:
        - address: upf
  gtpc:
    server:
      - dev: eth0
  gtpu:
    server:
      - dev: eth0
  metrics:
    server:
      - dev: eth0
        port: 9090
  session:
    - subnet: __INTERNET_UE_CIDR__
      gateway: __INTERNET_UE_GATEWAY__
      dnn: __INTERNET_DNN__
    - subnet: __IMS_UE_CIDR__
      gateway: __IMS_UE_GATEWAY__
      dnn: __IMS_DNN__
  p-cscf:
    - __PCSCF_IP__
  dns:
    - __DNS_IP__
    - 8.8.8.8
    - 8.8.4.4
  mtu: 1400
