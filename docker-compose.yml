# Entry point: domain-specific service definitions live under app/infrastructure/compose.
# Keep this deployment identifier stable: existing named volumes use this prefix.
# Repository name: 5g-lab; see docs/running.md for the distinction.
name: lab-docker
include:
  - path: app/infrastructure/compose/core-oai.yml
    project_directory: .
  - path: app/infrastructure/compose/access.yml
    project_directory: .
  - path: app/infrastructure/compose/ims.yml
    project_directory: .
  - path: app/infrastructure/compose/ai.yml
    project_directory: .

networks:
  lab5g:
    name: lab5g
    ipam:
      config:
        - subnet: ${LAB_NETWORK_CIDR}
          ip_range: ${LAB_DYNAMIC_IP_RANGE}
  ai-backend:
    name: lab-ai-backend
    internal: true

volumes:
  oai-mysql-data:
  mongo-data:
  mysql-data:
  service-control-secret:
  ai-model-cache:
  llm-model-cache:
