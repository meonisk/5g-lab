# Entry point: domain-specific service definitions live under deploy/compose.
include:
  - path: deploy/compose/core.yml
    project_directory: .
  - path: deploy/compose/access.yml
    project_directory: .
  - path: deploy/compose/ims.yml
    project_directory: .
  - path: deploy/compose/ai.yml
    project_directory: .

networks:
  lab5g:
    name: lab5g
    ipam:
      config:
        - subnet: ${LAB_NETWORK_CIDR}
          ip_range: ${LAB_DYNAMIC_IP_RANGE}
  ai-backend:
    name: lab-ai-backend
    internal: true

volumes:
  mongo-data:
  service-control-secret:
  ai-model-cache:
  llm-model-cache:
