# IMS + AI beside an independently managed OAI 5G core (Linux host).
# Run from the repository root: docker compose --env-file app/config/lab.env ...
# Keep this project name stable: existing named volumes use its prefix.
name: lab-docker
include:
  - path: app/infrastructure/compose/ims.yml
    project_directory: .
  - path: app/infrastructure/compose/ai.yml
    project_directory: .

networks:
  # The core owns this bridge; IMS and AI only attach to it with static IPs.
  lab5g:
    name: ${CORE_NETWORK_NAME:?Set CORE_NETWORK_NAME to the Docker network of the OAI core}
    external: true
  # Ollama is reachable only from the AI Worker.
  ai-backend:
    name: lab-ai-backend
    internal: true

volumes:
  mysql-data:
  service-control-secret:
  ai-model-cache:
  llm-model-cache:
